# 서버가 켜질 때 방을 자동으로 열지 (꺼져 있어도 /p2p open 으로 열 수 있습니다)
# 방을 열려면 먼저 /p2p login 으로 Minecraft 계정에 로그인해야 합니다
enabled: false
# 목록에 표시될 서버 이름
name: "Server"
# 방 타이틀 (비워두면 기본 MOTD 1번째 라인을 씁니다)
title: ""
# 공개 방 목록에 올릴지 (끄면 초대 코드로만 들어올 수 있습니다)
publicRoom: true

# 공개 방 목록에 올릴 모드 버전 ("auto"면 시그널링 서버가 알려주는 최신 배포 버전)
targetModVersion: "auto"

# QUIC이 쓸 UDP 포트 (0이면 매번 임의 포트, 방화벽에서 열어 두면 직결이 잘 됩니다)
# 25565(enable-query), 24454(Simple Voice Chat), 19132(Geyser)처럼 다른 UDP 용도와 겹치지 않게 하세요
udpPort: 0
# 방송 허용 방 — 공개 방 목록에 방송 허용 표시가 붙고(접속자에게 방송될 수 있음을 알림),
# 방송인(스트리머) 등급도 모드 UI로 추방·강퇴를 할 수 있습니다
allowBroadcast: false

# 공개 방 목록 채널 (최대 5개, 각 24자) — 같은 채널을 고른 사람에게만 보입니다
channels:
  - "normal"
# true면 위 채널을 모두 함께(AND) 고른 사람에게만 보입니다 (false면 하나라도 겹치면 보임)
channelAnd: false

# P2P 최대 인원 (/p2p max-players on|off|set <인원> 으로도 바꿀 수 있습니다)
# 켜면 P2P로 들어오는 접속은 서버 정원(max-players) 대신 maxPlayers 기준으로 막습니다 (서버 주소로 직접 접속은 서버 정원 그대로)
# 모드의 방 정원 표시도 이 값이 됩니다. maxPlayers는 서버 정원보다 클 수 없습니다
maxPlayersEnabled: false
maxPlayers: 0

# 방을 올릴 서버 (/p2p server 로도 바꿀 수 있습니다)
#   official  — 본점: 원본 instant-p2p 공식 서버
#   franchise — 가맹점: 원본 개발자가 허락한 비공식 수정판(sion)의 사설 서버. 초대 코드가 F-로 시작합니다
# franchise는 가맹점 약관에 동의해야 쓰입니다 — /p2p server franchise 로 약관을 보고 동의하세요
# (동의하면 아래 franchiseTermsAccepted에 약관 버전이 적힙니다. 동의 전에는 공식 서버를 씁니다)
signalingServer: "official"
franchiseTermsAccepted: ""

# 서버 고유 UUID (자동으로 채워집니다 — 로그인 정보 암호화에도 쓰이므로 바꾸지 마세요)
serverUuid: ""
